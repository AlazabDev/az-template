name: Validate production readiness

on:
  push:
    branches:
      - development
      - main
      - 'agent/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      - name: Structural and secret checks
        run: pnpm run quality:check

      - name: Unit tests
        run: pnpm run test:ci

      - name: Production build
        run: pnpm run build
        env:
          VITE_SUPABASE_PROJECT_ID: bxuhcbfdoaflsgbxiqei
          VITE_SUPABASE_URL: https://bxuhcbfdoaflsgbxiqei.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: test-public-key
          VITE_REDIRECT_URI: https://alazab.com/auth/callback
          VITE_API_URL: https://alazab.com/api
          VITE_FACEBOOK_REDIRECT_URI: https://alazab.com/auth/callback/facebook
